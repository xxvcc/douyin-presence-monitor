[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-presence-monitor"
version = "0.1.0"
description = "Self-hosted visible activity estimates with durable Telegram notifications"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Douyin Presence Monitor contributors"}]
dependencies = []

[project.scripts]
douyin-monitor = "douyin_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
