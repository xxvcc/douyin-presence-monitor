name: douyin-presence-monitor
services:
  monitor:
    image: douyin-presence-monitor:0.1.0
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DPM_HOME: /app
      TMPDIR: /app/tmp
    volumes:
      - type: bind
        source: ${DPM_INSTANCE_ROOT:-./instance}/config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DPM_INSTANCE_ROOT:-./instance}/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${DPM_INSTANCE_ROOT:-./instance}/logs
        target: /app/logs
        bind:
          create_host_path: false
      - type: bind
        source: ${DPM_INSTANCE_ROOT:-./instance}/backups
        target: /app/backups
        bind:
          create_host_path: false
      - type: bind
        source: ${DPM_INSTANCE_ROOT:-./instance}/exports
        target: /app/exports
        bind:
          create_host_path: false
    tmpfs:
      - /app/tmp:uid=10001,gid=10001,mode=0700,size=16m
    healthcheck:
      test: ["CMD", "/app/current/venv/bin/python", "-m", "douyin_monitor.health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 40s
    pids_limit: 64
    mem_limit: 256m
    # No management port and no Docker daemon socket.
